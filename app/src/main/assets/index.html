<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Plano Crescer Seco</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet"><style id="css">
/* direção: academia às 03:40. Fundo de madrugada, um único gradiente de amanhecer no anel de progresso e nas ações principais; o resto fica quieto. Uma coluna de celular, navegação flutuante. */
:root{
  --bg:#0b0d13; --surface:#141822; --raise:#1c2130; --line:#262c3c;
  --text:#f3f4f8; --muted:#8a92a8;
  --accent:#ff8a3d; --rose:#ff4f7b; --good:#4ade9b; --warn:#ffc857;
  --dawn:linear-gradient(120deg,#ff4f7b 0%,#ff8a3d 55%,#ffb23d 100%);
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Onest",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.5 var(--body);padding:0 16px 190px;-webkit-font-smoothing:antialiased}
#root{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em}
h2{font-size:21px;font-weight:700;letter-spacing:-.015em;margin-top:32px;margin-bottom:12px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
header.top{padding:26px 0 18px;display:flex;flex-direction:column;gap:8px}
header.hero{display:grid;grid-template-columns:124px 1fr;gap:18px;align-items:center}
header.hero>div:last-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:124px;height:124px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:800 34px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .c span{font-size:12px;color:var(--muted)}
.eyebrow{font:600 12px var(--body);color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);padding:4px;border-radius:16px}
.seg button{border-radius:12px;background:transparent;box-shadow:none}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.045)}
.stack{display:flex;flex-direction:column;gap:10px}
button{font:600 15px var(--body);color:var(--text);background:var(--raise);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .12s}
button:active{transform:scale(.97)}
button.on{background:var(--dawn);color:#1c0d06;box-shadow:0 6px 18px -8px rgba(255,110,70,.7)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input{font:500 16px var(--body);color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px;flex:1 1 90px}
/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--surface);border-radius:14px;padding:8px 2px 10px;text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.wd.today{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--accent)}
.wd b{font:700 18px/1.1 var(--display);color:var(--text)}
.bar{width:64%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--dawn)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:9px 0;font-size:13px;border-radius:12px}
/* roteiro */
.item{display:grid;grid-template-columns:50px 1fr 30px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:18px;padding:14px;font-weight:400;box-shadow:inset 0 0 0 1px rgba(255,255,255,.045)}
.item .t{font:700 15px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.item .ti{font-weight:600;font-size:16px;line-height:1.3;display:block}
.item .su{font-size:14px;line-height:1.4;color:var(--muted);display:block;margin-top:3px}
.item .box{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-size:15px;font-weight:700;color:transparent;transition:background .15s}
.item.done{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.item.done .t,.item.done .ti{color:var(--muted)}
.item.done .ti{text-decoration:line-through}
.item.done .su{display:none}
.item.done .box{background:var(--good);box-shadow:none;color:#06281a}
/* treino */
.ex{display:flex;flex-direction:column;gap:12px}
.ex .nm{font:700 17px/1.25 var(--display);letter-spacing:-.01em}
.goal{display:grid;grid-template-columns:1fr 104px;gap:12px;align-items:end}
.goal .n{font:800 34px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lad{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.lad span{background:var(--raise);border-radius:8px;padding:2px 9px;font-variant-numeric:tabular-nums}
.lad span.past{background:var(--line);color:var(--text)}
.lad span.cur{background:var(--dawn);color:#1c0d06;font-weight:700}
.lad span.up{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.ex .acts{display:flex;gap:8px;flex-wrap:wrap}
.ex .acts button{font-size:14px;padding:9px 15px}
.ok{color:var(--good);font-size:14px} .al{color:var(--warn);font-size:14px}
.tag{font:600 10px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn);border-radius:999px;padding:2px 8px;margin-left:8px;white-space:nowrap;vertical-align:middle}
.exh{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center}
.fig{background:var(--bg);border-radius:14px}
.fig polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fq{stroke:var(--muted);stroke-width:2.5;opacity:.55}
.fb{stroke:var(--text);stroke-width:4}
.fg{stroke:var(--accent);stroke-width:3.4;stroke-dasharray:4 5}
.fh{fill:var(--bg);stroke:var(--text);stroke-width:3}
.fgh{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:3 4;stroke-linecap:round}
.fw{fill:var(--text)} .fgw{fill:var(--accent)}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details ul{margin:10px 0}
a.vid{color:var(--accent);font-size:14px}
/* comida */
.meal{display:grid;grid-template-columns:50px 1fr;gap:12px}
.meal .t{font:700 15px var(--display);color:var(--accent);padding-top:1px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .n{font:800 28px/1.15 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
li::marker{color:var(--accent)}
.verdict{box-shadow:inset 4px 0 0 var(--muted),inset 0 0 0 1px rgba(255,255,255,.045)}
.verdict.good{box-shadow:inset 4px 0 0 var(--good),inset 0 0 0 1px rgba(255,255,255,.045)}
.verdict.warn{box-shadow:inset 4px 0 0 var(--warn),inset 0 0 0 1px rgba(255,255,255,.045)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
td button{padding:4px 10px;font-size:12px}
svg{display:block;width:100%;height:auto}
canvas{display:block;width:100%;height:340px;touch-action:pan-y;border-radius:20px;background:radial-gradient(120% 80% at 50% 0%,#1a1f2e 0%,#0e1119 70%);cursor:grab}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* navegação flutuante + timer */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(to top,var(--bg) 35%,transparent)}
nav>*{pointer-events:auto}
#tbar{width:100%;max-width:536px}
#tbar:empty{display:none}
.tb{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px 10px 16px;border-radius:22px;background:rgba(28,33,48,.94);box-shadow:inset 0 0 0 1px rgba(255,138,61,.5),0 10px 30px -10px #000}
.tb .n{font:800 36px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:78px;color:var(--accent)}
.tb.go{box-shadow:inset 0 0 0 1.5px var(--good),0 10px 30px -10px #000}
.tb.go .n{color:var(--good)}
.tb .lb{font-size:13px;line-height:1.25;color:var(--muted)}
.tb button{padding:8px 12px;font-size:13px}
#nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:536px;padding:6px;border-radius:26px;background:rgba(20,24,34,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 12px 34px -12px #000}
#nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--body);color:var(--muted);text-decoration:none;padding:8px 2px 7px;border-radius:20px}
#nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav a.on{background:var(--raise);color:var(--accent)}
#sync{font-size:12px;color:var(--muted);min-height:16px}
@media (max-width:360px){header.hero{grid-template-columns:100px 1fr}.ring,.ring svg{width:100px;height:100px}h1{font-size:34px}.exh{grid-template-columns:104px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 h+='<h2>Dia de descanso</h2><div class="card stack"><p class="small">O mesmo cardápio, com três mudanças:</p><ul class="small"><li>Sai a banana das 03:10 e o batido com banana e aveia.</li><li>O whey vira o lanche do fretado, com 1 fruta e 1 punhado de castanhas. Leve o pó na coqueteleira e ponha água na hora.</li><li>A creatina vai no café da manhã. Ela é todo dia.</li></ul></div>';
 h+='<h2>Medidas sem balança</h2><div class="card"><ul class="small"><li>1 escumadeira cheia de arroz ou macarrão: 100 g.</li><li>Carne, frango ou peixe do tamanho e da grossura da palma da mão: 150 g.</li><li>1 punhado fechado de castanhas: 20 g.</li><li>Salada e legumes sem molho: à vontade.</li></ul></div>';
 h+='<h2>Preparo do domingo</h2><div class="card"><ul class="small"><li>Asse ou cozinhe 1 kg de frango e refogue 500 g de carne moída.</li><li>Faça uma panela de arroz e cozinhe batata ou mandioca.</li><li>Monte 5 potes de jantar e guarde: 3 na geladeira, 2 no congelador.</li><li>Cozinhe 6 ovos e separe os lanches da semana na mochila.</li></ul></div>';

function verdict(){
 var m=state.meas.slice().sort(function(a,b){return a.d<b.d?-1:1});
 if(m.length<2)return ['','Meça toda semana no mesmo dia, ao acordar, depois do banheiro. Cintura na altura do umbigo, sem encolher. Com 2 semanas de dados o app diz se precisa ajustar a comida.'];
 var last=m[m.length-1],ref=null,lim=new Date(last.d+'T12:00');lim.setDate(lim.getDate()-12);var lk=iso(lim);
 m.forEach(function(x){if(x.d<=lk)ref=x});
 if(!ref)return ['','Faltam dias. A comparação é feita com a medida de 2 semanas atrás.'];
 var dc=(last.c&&ref.c)?last.c-ref.c:0,dp=(last.p&&ref.p)?last.p-ref.p:0;
 var txt='Em 2 semanas: peso '+(dp>=0?'+':'')+br(dp.toFixed(1))+' kg, cintura '+(dc>=0?'+':'')+br(dc.toFixed(1))+' cm. ';
 if(dc>=1||dp>1)return ['warn',txt+'Está entrando gordura. Tire meia escumadeira de arroz do almoço e meia do jantar pelas próximas 2 semanas.'];
 if(dp<-1)return ['warn',txt+'Peso caindo rápido demais pra quem quer crescer. Some 1 fatia de pão no café e 1 banana no lanche.'];
 if(dc<=-0.5)return ['good',txt+'Cintura caindo com o peso firme: músculo entrando, gordura saindo. Não mude nada.'];
 return ['good',txt+'Estável. Mantenha a comida e foque em bater as metas de carga.'];
}
function spark(vals,color){
 var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),r=(mx-mn)||1,n=vals.length,p='';
 vals.forEach(function(v,i){p+=(i?' ':'')+(8+i*(284/(n-1))).toFixed(1)+','+(52-(v-mn)/r*40).toFixed(1)});
 var ly=(52-(vals[n-1]-mn)/r*40).toFixed(1);
 return '<svg viewBox="0 0 300 60" role="img"><polyline points="'+p+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/><circle cx="292" cy="'+ly+'" r="4" fill="'+color+'"/></svg>';
}
var PARTS=[['p','Peso','kg'],['om','Ombros','cm'],['pe','Peito','cm'],['br','Braço','cm'],['c','Cintura','cm'],['qu','Quadril','cm'],['cx','Coxa','cm'],['pa','Panturrilha','cm']];
var cmpD=null,selP='',ang=0.45,drag=false,lastX=0,manOn=false;
/* boneco: [x1,y1,z1, x2,y2,z2, raio, parte] em cm aproximados */
var SEG=[[0,166,0,0,166,0,11,''],[0,150,0,0,157,0,5,''],
 [-19,145,0,19,145,0,8,'om'],[-11,134,1,11,134,1,15,'pe'],[-6,113,1,6,113,1,13,'c'],[-9,97,0,9,97,0,13,'qu'],
 [-26,142,0,-29,116,0,6.5,'br'],[26,142,0,29,116,0,6.5,'br'],
 [-29,116,0,-31,92,3,5,''],[29,116,0,31,92,3,5,''],[-31,86,3,-31,86,3,5.5,''],[31,86,3,31,86,3,5.5,''],
 [-10,90,0,-11,56,0,9.5,'cx'],[10,90,0,11,56,0,9.5,'cx'],
 [-11,56,0,-11,18,-1,6.5,'pa'],[11,56,0,11,18,-1,6.5,'pa'],
 [-11,8,-2,-11,8,9,5,''],[11,8,-2,11,8,9,5,'']];
var LBL=[['om',-19,147,0,0],['br',-28,128,0,0],['qu',-13,97,0,0],['pa',-11,36,0,0],['pe',11,134,8,1],['c',10,113,8,1],['cx',11,72,5,1]];
function mstats(){
 var m=state.meas.slice().sort(function(a,b){return a.d<b.d?-1:1}),o={};
 var ref=null;m.forEach(function(x){if(x.d===cmpD)ref=x});if(!ref&&m.length)ref=m[0];
 PARTS.forEach(function(p){var cur=null,cd='';m.forEach(function(x){if(x[p[0]]!=null){cur=x[p[0]];cd=x.d}});
  o[p[0]]={v:cur,d:cd,ref:(ref&&ref[p[0]]!=null&&ref.d!==cd)?ref[p[0]]:null}});
 o.refD=ref?ref.d:'';return o;
}
function dm(d){return d?d.slice(8)+'/'+d.slice(5,7):''}
function sg(x){return (x>=0?'+':'')+br(x.toFixed(1))}
function drawMan(){
 var cv=$('man');if(!cv)return;var w=cv.clientWidth||320,h=340,dpr=window.devicePixelRatio||1;
 if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
 var g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 var sc=(h-20)/182,cx=w/2,ca=Math.cos(ang),sa=Math.sin(ang);
 function P(x,y,z){return [cx+(x*ca+z*sa)*sc,h-8-y*sc,-x*sa+z*ca]}
 var its=SEG.map(function(q){var a=P(q[0],q[1],q[2]),b=P(q[3],q[4],q[5]);return {a:a,b:b,r:q[6]*sc,z:(a[2]+b[2])/2,p:q[7]}}).sort(function(m,n){return m.z-n.z});
 g.lineCap='round';
 its.forEach(function(it){
  var t=Math.max(0,Math.min(1,(it.z+32)/64)),on=it.p&&it.p===selP;
  g.strokeStyle=on?'hsl(22,100%,'+(54+t*10)+'%)':'hsl(226,16%,'+(30+t*18)+'%)';
  g.lineWidth=it.r*2;g.beginPath();g.moveTo(it.a[0],it.a[1]);g.lineTo(it.b[0]+0.01,it.b[1]);g.stroke();
  g.strokeStyle=on?'hsla(30,100%,82%,.5)':'hsla(226,40%,86%,.22)';
  g.lineWidth=it.r*0.7;var o=it.r*0.38;g.beginPath();g.moveTo(it.a[0]-o,it.a[1]-o);g.lineTo(it.b[0]-o+0.01,it.b[1]-o);g.stroke();
 });
 var st=mstats();
 LBL.forEach(function(l){
  var p=P(l[1],l[2],l[3]),name='',unit='';PARTS.forEach(function(q){if(q[0]===l[0]){name=q[1];unit=q[2]}});
  var d=st[l[0]],right=l[4],tx=right?w-8:8,on=selP===l[0];
  g.strokeStyle=on?'#ff8a3d':'rgba(138,146,168,.5)';g.lineWidth=1;g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(right?w-92:92,p[1]);g.stroke();
  g.textAlign=right?'right':'left';g.fillStyle=on?'#ff8a3d':'#f3f4f8';g.font='600 13px Onest, sans-serif';
  g.fillText(name+' '+(d.v!=null?br(d.v)+' '+unit:'–'),tx,p[1]-3);
  if(d.ref!=null){g.fillStyle='#8a92a8';g.font='12px Onest, sans-serif';g.fillText(sg(d.v-d.ref)+' desde '+dm(st.refD),tx,p[1]+11)}
 });
}
function manLoop(){
 if(!$('man')){manOn=false;return}
 if(!drag&&!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches))ang+=0.005;
 drawMan();requestAnimationFrame(manLoop);
}
function initMan(){
 var cv=$('man');if(!cv)return;
 cv.addEventListener('pointerdown',function(e){drag=true;lastX=e.clientX;try{cv.setPointerCapture(e.pointerId)}catch(x){}});
 cv.addEventListener('pointermove',function(e){if(drag){ang+=(e.clientX-lastX)*0.012;lastX=e.clientX}});
 ['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drag=false})});
 if(!manOn){manOn=true;requestAnimationFrame(manLoop)}
}
function vMedidas(){
 var v=verdict(),m=state.meas.slice().sort(function(a,b){return a.d<b.d?1:-1}),st=mstats();
 var h='<header class="top"><span class="eyebrow">Peso e cintura toda semana, o resto a cada 2 semanas</span><h1>Medidas</h1><p class="muted">A cintura manda. Se ela não sobe e as outras medidas e as cargas sobem, você está crescendo do jeito certo.</p><span id="sync">'+esc(syncMsg)+'</span></header>';
 h+='<div class="card verdict '+v[0]+'">'+v[1]+'</div>';
 h+='<h2>Seu corpo</h2><canvas id="man" aria-label="Boneco com as medidas de cada parte do corpo"></canvas><p class="muted small" style="margin-top:6px">Arraste para girar. Toque num campo abaixo para destacar a parte.</p>';
 if(m.length>1){
  h+='<div class="card stack" style="margin-top:10px"><label>Comparar a medida atual com<select id="cmp">';
  m.slice().reverse().forEach(function(x){h+='<option value="'+x.d+'"'+(x.d===st.refD?' selected':'')+'>'+x.d.split('-').reverse().join('/')+'</option>'});
  h+='</select></label><table><tr><th>Parte</th><th>'+dm(st.refD)+'</th><th>Atual</th><th>Diferença</th></tr>';
  PARTS.forEach(function(p){var d=st[p[0]];if(d.v==null)return;h+='<tr><td>'+p[1]+'</td><td>'+(d.ref!=null?br(d.ref):'–')+'</td><td>'+br(d.v)+' '+p[2]+'</td><td>'+(d.ref!=null?sg(d.v-d.ref):'–')+'</td></tr>'});
  h+='</table></div>';}
 h+='<h2>Nova medida</h2><div class="card stack"><label>Data<input id="m-d" type="date" value="'+TODAY+'"></label><div class="grid2">';
 PARTS.forEach(function(p){h+='<label>'+p[1]+' ('+p[2]+')<input id="m-'+p[0]+'" data-part="'+p[0]+'" inputmode="decimal"></label>'});
 h+='</div><button id="m-add" class="on">Registrar</button><p class="muted small">Preencha só o que mediu hoje. O resto fica como estava.</p><details><summary>Onde passar a fita</summary><ul class="small"><li>Sempre ao acordar, depois do banheiro, antes do treino.</li><li>Ombros: em volta, na parte mais larga, braços soltos.</li><li>Peito: na linha dos mamilos, depois de soltar o ar.</li><li>Braço: direito, contraído, no ponto mais alto do bíceps.</li><li>Cintura: na altura do umbigo, sem encolher.</li><li>Quadril: na parte mais larga do glúteo.</li><li>Coxa: direita, no meio, em pé e relaxado.</li><li>Panturrilha: direita, na parte mais grossa.</li></ul></details></div>';
 if(m.length>1){var asc=m.slice().reverse(),ps=asc.filter(function(x){return x.p}).map(function(x){return x.p}),cs=asc.filter(function(x){return x.c}).map(function(x){return x.c});
  if(ps.length>1||cs.length>1)h+='<h2>Evolução</h2><div class="kpis">'+(ps.length>1?'<div class="card"><span class="muted small">Peso, kg</span>'+spark(ps,'var(--accent)')+'</div>':'')+(cs.length>1?'<div class="card"><span class="muted small">Cintura, cm</span>'+spark(cs,'var(--good)')+'</div>':'')+'</div>';}
 if(m.length){h+='<h2>Histórico</h2><div class="card"><table><tr><th>Data</th><th>Peso</th><th>Cintura</th><th>Braço</th><th></th></tr>';
  m.forEach(function(x){h+='<tr><td>'+dm(x.d)+'</td><td>'+(x.p?br(x.p):'–')+'</td><td>'+(x.c?br(x.c):'–')+'</td><td>'+(x.br?br(x.br):'–')+'</td><td><button data-del="'+x.d+'" aria-label="Apagar medida">Apagar</button></td></tr>'});
  h+='</table></div>';}
 h+='<h2>O que esperar</h2><div class="card"><ul class="small"><li>Primeiras 8 semanas: peso entre 76 e 78 kg, cintura caindo de 2 a 4 cm, cargas subindo a cada 2 a 3 semanas.</li><li>Braço, peito e coxa sobem devagar: meio centímetro por mês já é bom resultado.</li><li>Depois: ganho lento, até 0,5 kg por mês, com a cintura parada.</li><li>Tire uma foto de frente e de lado a cada 4 semanas, mesma luz.</li></ul></div>';
 return h;
}
function vGuia(){
 var b=function(t,l){return '<h2>'+t+'</h2><div class="card"><ul class="small">'+l.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'};
 return '<header class="top"><span class="eyebrow">As regras do plano</span><h1>Guia</h1></header>'+
 b('Sono, o ponto mais fraco hoje',['Com 5 a 6 horas o corpo constrói menos músculo e guarda mais gordura na barriga. Nenhum suplemento compensa isso.','Meta: na cama às 20:15 nos dias de treino. São quase 7 horas até as 03:10.','Você chega às 18:30: jantar pronto às 18:45, banho, telas fora às 19:30, quarto escuro e fresco.','Cochile no fretado, na ida ou na volta. 20 a 30 minutos por dia fazem diferença.','Semana com menos de 6 horas por noite: faça 4 treinos em vez de 5.'])+
 b('Suplementos',['<b>Creatina:</b> 5 g todo dia, inclusive no descanso. É o que mais funciona da sua lista.','<b>Whey:</b> 1 dose de 30 g por dia. É comida, serve pra fechar a proteína.','<b>BCAA:</b> pode terminar o pote e não comprar de novo. Com 165 g de proteína por dia ele não acrescenta nada.','<b>Magnésio:</b> à noite, perto das 19:30. Ajuda a relaxar pra dormir.','<b>The Pump Father:</b> não tem cafeína, então não atrapalha seu sono. Dá mais pump e um pouco de fôlego nas séries longas; o formigamento na pele vem da beta-alanina e é inofensivo. É opcional: o crescimento vem de carga, proteína e sono. Uma dose de 10 g ao acordar.'])+
 b('Chás',['Chá verde e gengibre: de manhã, até o meio-dia. Chá verde tem cafeína.','Hibisco e cavalinha são diuréticos: tiram água, não gordura. A barriga não some com eles.','Último chá diurético até as 15h, pra não acordar de noite pra urinar.','Cavalinha: use por algumas semanas e faça pausas, não todo dia o ano inteiro.','Sempre sem açúcar. No treino, água.'])+
 b('Cardio e movimento',['15 minutos depois da musculação em todo dia de treino. Não precisa de um dia só de cardio.','8 mil passos por dia. Isso gasta mais que o cardio em si.','Abdominal fortalece, mas não queima a gordura da barriga. Quem tira é a comida.'])+
 b('Semana modelo',['Segunda A, terça B, quarta C, quinta descanso, sexta A, sábado B, domingo descanso. Na semana seguinte começa pelo C.','Quinta e domingo são descanso de verdade: só caminhada leve, sem cardio forte. No sábado dá pra dormir mais e treinar mais tarde.','Mínimo aceitável: 4 treinos. Sua média desde setembro é 3,3 por semana; nas duas últimas você fez 5.'])+
 '<p class="muted small" style="margin-top:18px">Plano geral de treino e alimentação, feito com os dados que você passou. Dor articular, tontura ou pressão alterada pedem avaliação médica; um nutricionista pode afinar as quantidades com exames.</p>';
}
function render(){

$('root').addEventListener('click',function(ev){
 var b=ev.target.closest('button');if(!b)return;var d=b.dataset,day=dayOf(TODAY),e,s;
 if(d.wd){selD=+d.wd;render();return}
 if(d.set||d.hold){var id=d.set||d.hold,n=ses.sets[id]||0;e=findEx(id);
  if(n>=3){ses.sets[id]=0;sesSave();render();return}
  ses.sets[id]=n+1;
  if(d.hold)startT(ladder(e)[exS(e).i],'Prancha, série '+(n+1)+' de 3: segure');
  else startT(restOf(id),n+1<3?e[1]+': descanso antes da série '+(n+2):e[1]+' concluído: troca de exercício');
  render();return}
 if(d.cardio){startT(900,'Cardio de 15 min');return}
 if(d.chk){day.c[d.chk]=!day.c[d.chk];if(d.chk==='treino'&&day.c.treino)day.w=letterFor(TODAY)}
 else if(d.type){if(day.type===d.type)return;day.type=d.type;day.c={}}
 else if(d.w){selW=d.w;if(!day.c.treino){day.w=d.w}else{render();return}}
 else if(d.hit){e=findEx(d.hit);s=exS(e);s.prev={i:s.i,kg:s.kg,fails:s.fails||0};
  if(s.i<ladder(e).length-1)s.i++;else{var nl=incLoad(s.kg,e[5]);if(nl){logKg(e,s,nl);s.i=0}}
  s.fails=0;s.last=TODAY;s.res='hit'}
 else if(d.miss){e=findEx(d.miss);s=exS(e);s.prev={i:s.i,kg:s.kg,fails:s.fails||0};s.fails=(s.fails||0)+1;s.last=TODAY;s.res='miss'}
 else if(d.undo){e=findEx(d.undo);s=exS(e);if(s.prev){if(s.prev.kg!==s.kg&&s.hist)s.hist.pop();s.i=s.prev.i;s.kg=s.prev.kg;s.fails=s.prev.fails}delete s.prev;delete s.last;delete s.res}
 else if(b.id==='m-add'){var dt=$('m-d').value||TODAY,ent=null,any=false;
  state.meas.forEach(function(x){if(x.d===dt)ent=x});if(!ent)ent={d:dt};
  PARTS.forEach(function(p){var v=num($('m-'+p[0]).value);if(v!==null){ent[p[0]]=v;any=true}});
  if(!any)return;if(state.meas.indexOf(ent)<0)state.meas.push(ent)}
 else if(d.del){state.meas=state.meas.filter(function(x){return x.d!==d.del})}
 else return;
 save();render();
});
