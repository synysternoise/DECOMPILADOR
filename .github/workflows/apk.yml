name: Gerar APK

on:
  push:
    branches: [plano-crescer-seco]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle --no-daemon assembleRelease

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk CrescerSeco.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrescerSeco
          path: CrescerSeco.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Crescer Seco 1.${{ github.run_number }}
          files: CrescerSeco.apk
